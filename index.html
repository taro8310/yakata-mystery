<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洋館ミステリー</title>
  <style>
    :root {
      --bg-dark: #0f111a;
      --panel-bg: #1a1d2e;
      --accent-gold: #d4af37;
      --accent-red: #8b0000;
      --accent-purple: #7e22ce;
      --text-main: #e0e0e0;
      --text-dim: #9e9e9e;
      --status-green: #22c55e;
      --status-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', 'Yu Mincho', serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    #game-container {
      width: 100%;
      max-width: 1050px;
      height: 92vh;
      background: var(--panel-bg);
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 8px;
    }

    header {
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-bottom: 1px solid var(--accent-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    h1 { font-size: 1.0rem; color: var(--accent-gold); letter-spacing: 1px; }

    .main-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background: rgba(0,0,0,0.3);
      border-right: 1px solid rgba(212,175,55,0.2);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-title {
      font-size: 0.82rem;
      color: var(--accent-gold);
      border-bottom: 1px solid var(--accent-gold);
      padding-bottom: 4px;
    }

    .target-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid transparent;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .target-card:hover, .target-card.active {
      border-color: var(--accent-gold);
      background: rgba(212,175,55,0.12);
    }
    .target-card.all-card.active {
      border-color: #a855f7;
      background: rgba(168,85,247,0.15);
    }
    .target-name { font-weight: bold; font-size: 0.88rem; display: flex; justify-content: space-between; }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(0,0,0,0.2);
    }

    .tabs {
      display: flex;
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid rgba(212,175,55,0.2);
    }
    .tab-btn {
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.82rem;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--accent-gold);
      border-bottom-color: var(--accent-gold);
      background: rgba(212,175,55,0.05);
    }

    .chat-logs, .memo-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .memo-area {
      display: none;
      background: #141622;
      color: #d1d5db;
      font-family: monospace;
      line-height: 1.6;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .msg.system {
      align-self: center;
      background: rgba(212,175,55,0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      font-size: 0.78rem;
      text-align: center;
    }
    .msg.player {
      align-self: flex-end;
      background: #2b3a4e;
      border: 1px solid #4a6572;
    }
    .msg.npc {
      align-self: flex-start;
      background: #252836;
      border: 1px solid #3b3e53;
    }
    .msg-author { font-size: 0.75rem; color: var(--accent-gold); margin-bottom: 4px; font-weight: bold; }

    .controls {
      padding: 12px 15px;
      background: rgba(0,0,0,0.4);
      border-top: 1px solid rgba(212,175,55,0.2);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suggest-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      white-space: nowrap;
      scrollbar-width: thin;
    }
    .suggest-chips::-webkit-scrollbar {
      height: 4px;
    }
    .suggest-chips::-webkit-scrollbar-thumb {
      background: rgba(212,175,55,0.3);
      border-radius: 2px;
    }

    .chip {
      background: rgba(212,175,55,0.1);
      border: 1px solid var(--accent-gold);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      max-width: 350px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid #444;
      padding: 10px;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    button {
      background: #2a2e3d;
      color: var(--text-main);
      border: 1px solid var(--accent-gold);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button.primary { background: var(--accent-red); border-color: #ff4d4d; }

    /* スマホ表示 */
    @media (max-width: 700px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      #game-container {
        width: 100%;
        max-width: none;
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      header {
        padding: 9px 12px;
      }

      h1 {
        font-size: 0.9rem;
      }

      .main-body {
        min-height: 0;
      }

      .sidebar {
        width: 145px;
        min-width: 145px;
        padding: 10px;
        gap: 8px;
        overflow-y: auto;
      }

      .target-card {
        padding: 8px;
      }

      .target-name {
        font-size: 0.75rem;
      }

      .content-area {
        min-width: 0;
      }

      .tab-btn {
        padding: 9px 8px;
        font-size: 0.72rem;
      }

      .chat-logs,
      .memo-area {
        padding: 10px;
      }

      .msg {
        max-width: 94%;
        font-size: 0.84rem;
      }

      .controls {
        padding: 9px 10px;
      }

      input[type="text"] {
        min-width: 0;
        font-size: 16px;
      }

      button {
        font-size: 0.78rem;
        padding: 7px 9px;
      }

      .chip {
        max-width: 220px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <h1>洋館ミステリー</h1>
    <button onclick="initGame()">🔄 事件生成</button>
  </header>

  <div class="main-body">
    <div class="sidebar">
      <div class="sidebar-title">会話対象を選択</div>

      <!-- 全体会話ターゲット -->
      <div class="target-card all-card active" id="target-all" onclick="switchTarget('all')">
        <div class="target-name">
          <span>📢 大広間（全員）</span>
          <span style="font-size:0.75rem; color:#a855f7;">全体尋問</span>
        </div>
      </div>

      <!-- 個別ターゲット一覧 -->
      <div id="npc-list"></div>

      <div class="sidebar-title" style="margin-top:10px;">事件概要</div>
      <div style="font-size: 0.78rem; color: var(--text-dim); line-height: 1.4;">
        <p>被害者: ヴォルコフ館主</p>
        <p>時刻: 昨夜22:00頃</p>
        <p>場所: 書斎</p>
      </div>

      <button class="primary" style="margin-top: auto;" onclick="accusePhase()">告発（犯人を指名）</button>
    </div>

    <div class="content-area">
      <div class="tabs">
        <button class="tab-btn active" id="tab-chat" onclick="showTab('chat')">💬 尋問ログ (<span id="chat-title">大広間</span>)</button>
        <button class="tab-btn" id="tab-memo" onclick="showTab('memo')">📝 探偵メモ</button>
      </div>

      <div class="chat-logs" id="chat-logs"></div>
      <div class="memo-area" id="memo-area">
        <h3>🔍 探偵の調査メモ</h3>
        <hr style="border-color:#333; margin:10px 0;">
        <div id="memo-content">まだ記録はありません。尋問を行ってください。</div>
      </div>

      <div class="controls">
        <div class="suggest-chips" id="suggest-chips"></div>
        <div class="input-row">
          <input type="text" id="player-input" placeholder="質問を入力してください..." onkeypress="handleKeyPress(event)">
          <button id="send-btn" onclick="sendPlayerMessage()">質問する</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // =========================================================
  // GitHub Pages用設定
  // Gemini APIキーはここには書かないでください。
  // Cloudflare WorkerがGemini APIを安全に呼び出します。
  //
  // 例:
  // const WORKER_URL = "https://yakata-mystery-api.あなたの名前.workers.dev";
  // =========================================================
  const WORKER_URL = "https://yakata-mystery.taro-hameed.workers.dev";

  let currentTarget = 'all'; // 'all', 'butler', 'doctor', 'lady'
  let npcs = {};
  let chatHistories = {
    all: [],
    butler: [],
    doctor: [],
    lady: []
  };
  let dynamicSuggestions = {
    all: [],
    butler: [],
    doctor: [],
    lady: []
  };
  let killerId = '';
  let memoEntries = [];

  window.onload = () => {
    initGame();

    if (!WORKER_URL || WORKER_URL.includes('ここにCloudflare')) {
      addSystemLog('⚠️ Cloudflare WorkerのURLが未設定です。GitHub Pages公開後はWorkerのURLを設定してください。');
    }
  };

  function cleanResponseText(rawText) {
    let clean = rawText
      .replace(/[\*\_\#]/g, '')
      .replace(/Character:[\s\S]*?(\n|$)/gi, '')
      .replace(/Option [A-Z]:[\s\S]*?(\n|$)/gi, '')
      .replace(/Direct answer:[\s\S]*?(\n|$)/gi, '')
      .replace(/Avoidance:[\s\S]*?(\n|$)/gi, '')
      .replace(/Style:[\s\S]*?(\n|$)/gi, '')
      .replace(/Secret:[\s\S]*?(\n|$)/gi, '')
      .replace(/[a-zA-Z]{3,}:[\s\S]*?(\n|$)/g, '')
      .replace(/^[a-zA-Z0-9\s\.,\-\*'":\(\)]+$/gm, '')
      .trim();

    const lines = clean.split('\n').map(l => l.trim()).filter(l => l.length > 0 && /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/.test(l));
    return lines.length > 0 ? lines.join(' ') : rawText.trim();
  }

  async function callGemini(systemInstruction, contents, retries = 2) {
    if (!WORKER_URL || WORKER_URL.includes('ここにCloudflare')) {
      return {
        success: false,
        error: 'Cloudflare WorkerのURLが設定されていません。'
      };
    }

    try {
      const generationConfig = {
        temperature: 0.2,
        maxOutputTokens: 200,
        topP: 0.8
      };

      const requestBody = {
        contents: contents,
        systemInstruction: {
          parts: [{ text: systemInstruction }]
        },
        generationConfig
      };

      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      });

      if (res.status === 503 && retries > 0) {
        await new Promise(resolve => setTimeout(resolve, 800));
        return await callGemini(systemInstruction, contents, retries - 1);
      }

      const data = await res.json();

      if (
        res.ok &&
        data.candidates &&
        data.candidates[0] &&
        data.candidates[0].content &&
        data.candidates[0].content.parts &&
        data.candidates[0].content.parts[0].text
      ) {
        const cleanedText = cleanResponseText(data.candidates[0].content.parts[0].text);
        return {
          success: true,
          text: cleanedText,
          model: data.modelVersion || 'Cloudflare Worker / Gemini'
        };
      }

      const err = data.error
        ? `${data.error.code || ''}: ${data.error.message || 'APIエラー'}`
        : 'レスポンスエラー';

      return { success: false, error: err };
    } catch (e) {
      return { success: false, error: e.message };
    }
  }

  function initGame() {
    memoEntries = [];
    chatHistories = { all: [], butler: [], doctor: [], lady: [] };
    
    dynamicSuggestions = {
      all: [
        { label: '全員にアリバイを聞く', text: '昨夜22時頃のアリバイを教えてください。' },
        { label: '不審な音について聞く', text: '昨夜、何か不審な音や人影に気づきましたか？' }
      ],
      butler: [
        { label: '22時のアリバイを聞く', text: '昨夜22時頃はどこで何をしていましたか？' },
        { label: '館主とのトラブルを聞く', text: '館主との間に最近トラブルはありませんでしたか？' }
      ],
      doctor: [
        { label: '昨夜のアリバイを聞く', text: '昨夜22時頃、どちらにいらっしゃいましたか？' },
        { label: '処方薬について尋ねる', text: '館主に処方していたお薬に異常はありませんでしたか？' }
      ],
      lady: [
        { label: '自室でのアリバイを聞く', text: '22時頃、自室にいた証拠はありますか？' },
        { label: '何か音を聞いたか聞く', text: '昨夜、何か気になる音を聞きませんでしたか？' }
      ]
    };

    const keys = ['butler', 'doctor', 'lady'];
    killerId = keys[Math.floor(Math.random() * keys.length)];

    npcs = {
      butler: {
        id: 'butler',
        name: 'アルフレッド',
        role: '執事',
        isKiller: killerId === 'butler',
        motive: '給料未払いや冷酷な扱いに耐えかねてのこと。',
        method: '厨房で密かに用意した毒を紅茶に混ぜ、22:00に書斎の館主に飲ませて毒殺した。',
        secret: killerId === 'butler'
          ? 'あなたが真犯人です。22:00に書斎で館主を毒殺しました。「厨房で紅茶を入れていた」と嘘をついてください。'
          : 'あなたは無実です。22:00は実際に厨房で紅茶を入れていました。給料未払いで館主と喧嘩したことは隠したがっています。'
      },
      doctor: {
        id: 'doctor',
        name: 'エイブリー',
        role: '主治医',
        isKiller: killerId === 'doctor',
        motive: '過去の医療ミスや不正を館主に告発されると脅されていたため。',
        method: '22:00に持病の定期薬と偽って致死性の毒薬を処方し、自ら服用させた。',
        secret: killerId === 'doctor'
          ? 'あなたが真犯人です。22:00に見せかけの薬を渡して毒殺しました。「応接間で一人で読書をしていた」と嘘をついてください。'
          : 'あなたは無実です。22:00は自分の往診バッグを整理していました。新薬の不正利用を疑われていたことは黙っていたいです。'
      },
      lady: {
        id: 'lady',
        name: 'エレノア',
        role: '親族',
        isKiller: killerId === 'lady',
        motive: '遺産相続をめぐる激しい口論の末、突発的な怒りから。',
        method: '22:00に書斎で館主と口論になり、重い文鎮で頭部を激しく殴打して殺害した。',
        secret: killerId === 'lady'
          ? 'あなたが真犯人です。22:00に書斎で館主と争い、殴打して殺害しました。「自室で日記を書いていた」と嘘をついてください。'
          : 'あなたは無実です。22:00は自室で日記を書いていました。22:05頃に書斎の方からドサッという大きな音を聞きました。'
      }
    };

    renderNPCs();
    switchTarget('all');
    addSystemLog(`事件が生成されました！犯人がランダムに決定されました。`);
  }

  function renderNPCs() {
    const container = document.getElementById('npc-list');
    container.innerHTML = '';

    Object.values(npcs).forEach(npc => {
      const card = document.createElement('div');
      card.className = `target-card ${currentTarget === npc.id ? 'active' : ''}`;
      card.id = `target-${npc.id}`;
      card.onclick = () => switchTarget(npc.id);
      card.innerHTML = `
        <div class="target-name">
          <span>${npc.name}</span>
          <span style="font-size:0.75rem; color:var(--text-dim);">${npc.role}</span>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function switchTarget(targetId) {
    currentTarget = targetId;

    document.querySelectorAll('.target-card').forEach(c => c.classList.remove('active'));
    const activeCard = document.getElementById(`target-${targetId}`);
    if (activeCard) activeCard.classList.add('active');

    const title = targetId === 'all' ? '大広間（全体）' : npcs[targetId].name;
    document.getElementById('chat-title').innerText = title;

    renderChatLogs();
    renderSuggestions();
  }

  function renderChatLogs() {
    const container = document.getElementById('chat-logs');
    container.innerHTML = '';

    const history = chatHistories[currentTarget] || [];
    history.forEach(log => {
      const msg = document.createElement('div');
      msg.className = `msg ${log.type}`;
      msg.innerHTML = log.type !== 'system' ? `<div class="msg-author">${log.author}</div>${log.text}` : log.text;
      container.appendChild(msg);
    });

    container.scrollTop = container.scrollHeight;
  }

  function renderSuggestions() {
    const container = document.getElementById('suggest-chips');
    container.innerHTML = '';

    let chips = dynamicSuggestions[currentTarget] || [];
    // 常に最大2つまでに制限
    if (chips.length > 2) {
      chips = chips.slice(-2);
    }

    chips.forEach((item, index) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerText = item.label;
      chip.title = item.text;
      chip.onclick = () => useSuggestion(index);
      container.appendChild(chip);
    });
  }

  async function useSuggestion(index) {
    let chips = dynamicSuggestions[currentTarget] || [];
    if (chips.length > 2) {
      chips = chips.slice(-2);
    }
    const item = chips[index];
    if (!item) return;

    // 元の配列から該当要素を削除
    const originalIndex = dynamicSuggestions[currentTarget].indexOf(item);
    if (originalIndex > -1) {
      dynamicSuggestions[currentTarget].splice(originalIndex, 1);
    }
    renderSuggestions();

    document.getElementById('player-input').value = item.text;
    await sendPlayerMessage();
  }

  async function generateNewSuggestion() {
    const targetName = currentTarget === 'all' ? '全員（大広間）' : npcs[currentTarget].name;

    const fallbacks = [
      { label: '詳しく話を追及する', text: 'もう少し詳しく当時の様子を教えてもらえますか？' },
      { label: '矛盾点について問いただす', text: '先ほどの発言と少し食い違う気がしますが、どういうことですか？' }
    ];

    if (!apiKey || apiKey === "ここにAPIキーを貼り付け") {
      return fallbacks[Math.floor(Math.random() * fallbacks.length)];
    }

    const systemInstruction = `
あなたは本格ミステリーアドベンチャーゲームのシステムアシスタントです。
現在選択されている対象（${targetName}）との間の会話ログを踏まえ、プレイヤーが次に投げかけるべき「自然で推理を深めるための候補質問」を1つだけ考案してください。

【出力フォーマット】
ラベル: (ボタンに表示する短い名詞句、10〜15文字程度)
質問文: (実際に探偵が入力する具体的な尋問セリフ)
`;

    const history = chatHistories[currentTarget] || [];
    const contents = [];
    for (const h of history) {
      if (h.type === 'player') contents.push({ role: 'user', parts: [{ text: h.text }] });
      else if (h.type === 'npc') contents.push({ role: 'model', parts: [{ text: h.text }] });
    }
    contents.push({ role: 'user', parts: [{ text: 'これまでの流れを踏まえ、次に使える新しい質問案を「ラベル:〇〇\n質問文:〇〇」の形式で1つ提案して。' }] });

    const result = await callGemini(systemInstruction, contents);
    if (result.success) {
      const text = result.text;
      const labelMatch = text.match(/ラベル[:：]\s*(.+)/);
      const qMatch = text.match(/質問文[:：]\s*(.+)/);

      if (labelMatch && qMatch) {
        return {
          label: labelMatch[1].trim().replace(/[\*\_\#]/g, ''),
          text: qMatch[1].trim().replace(/[\*\_\#]/g, '')
        };
      }
    }

    return fallbacks[Math.floor(Math.random() * fallbacks.length)];
  }

  async function askSingleNPC(npc, text) {
    if (!WORKER_URL || WORKER_URL.includes('ここにCloudflare')) {
      return `【設定待ち】Cloudflare WorkerのURLが未設定です。`;
    }

    const systemInstruction = `
あなたは本格ミステリー小説の登場人物「${npc.name}（${npc.role}）」です。
【裏設定】${npc.secret}

【絶対ルール】
・これまでの会話履歴を踏まえ、過去の自分の発言や設定と矛盾しない一貫性のある返答をしてください。
・英語、思考プロセス、下書き、選択肢、補足説明は出力禁止。
・100%日本語で、「${npc.name}」としての台詞（1〜2文）のみを直接出力してください。
`;

    const npcHistory = chatHistories[npc.id] || [];
    const contents = [];

    for (const h of npcHistory) {
      if (h.type === 'player') {
        contents.push({ role: 'user', parts: [{ text: h.text }] });
      } else if (h.type === 'npc') {
        contents.push({ role: 'model', parts: [{ text: h.text }] });
      }
    }

    contents.push({ role: 'user', parts: [{ text: text }] });

    const result = await callGemini(systemInstruction, contents);

    return result.success ? result.text : `🔴 APIエラー: ${result.error}`;
  }

  async function sendPlayerMessage() {
    const input = document.getElementById('player-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';

    document.getElementById('send-btn').innerText = '応答中...';
    document.getElementById('send-btn').disabled = true;

    if (currentTarget === 'all') {
      pushLog('all', '探偵（全体質問）', text, 'player');

      const promises = Object.values(npcs).map(async (npc) => {
        pushLog(npc.id, '探偵（全体質問）', text, 'player');
        const reply = await askSingleNPC(npc, text);
        pushLog(npc.id, npc.name, reply, 'npc');
        return { npc, reply };
      });

      const results = await Promise.all(promises);

      results.forEach(({ npc, reply }) => {
        pushLog('all', npc.name, reply, 'npc');
        updateMemo(`【全体質問】${npc.name}: "${reply}"`);
      });

    } else {
      const npc = npcs[currentTarget];
      pushLog(currentTarget, '探偵（あなた）', text, 'player');

      const reply = await askSingleNPC(npc, text);
      pushLog(currentTarget, npc.name, reply, 'npc');
      updateMemo(`【個別質問】${npc.name}: "${reply}"`);
    }

    const newChip = await generateNewSuggestion();
    dynamicSuggestions[currentTarget].push(newChip);

    // 追加後も最大2つを超えないように調整
    if (dynamicSuggestions[currentTarget].length > 2) {
      dynamicSuggestions[currentTarget] = dynamicSuggestions[currentTarget].slice(-2);
    }

    document.getElementById('send-btn').innerText = '質問する';
    document.getElementById('send-btn').disabled = false;
    renderSuggestions();
  }

  function pushLog(targetKey, author, text, type) {
    if (!chatHistories[targetKey]) chatHistories[targetKey] = [];
    chatHistories[targetKey].push({ author, text, type });
    if (currentTarget === targetKey) {
      renderChatLogs();
    }
  }

  function addSystemLog(text) {
    pushLog(currentTarget, '', text, 'system');
  }

  function updateMemo(entry) {
    memoEntries.push(entry);
    document.getElementById('memo-content').innerHTML = memoEntries.map(e => `<p style="margin-bottom:8px;">• ${e}</p>`).join('');
  }

  function showTab(tab) {
    document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
    document.getElementById('tab-memo').classList.toggle('active', tab === 'memo');
    document.getElementById('chat-logs').style.display = tab === 'chat' ? 'flex' : 'none';
    document.getElementById('memo-area').style.display = tab === 'memo' ? 'block' : 'none';
  }

  function handleKeyPress(e) { if (e.key === 'Enter') sendPlayerMessage(); }

  function accusePhase() {
    const choice = prompt('犯人だと思う人物を入力してください（アルフレッド / エイブリー / エレノア）');
    if (!choice) return;

    const target = Object.values(npcs).find(n => choice.includes(n.name));
    const trueKiller = Object.values(npcs).find(n => n.isKiller);

    if (target && target.isKiller) {
      alert(`🎉 正解です！犯人は【${target.name}】でした！\n\n各チャットと探偵メモの証言から見事な推理を展開しました！`);
    } else {
      alert(`❌ 不正解…！推理が外れてしまいました。\n\n【真相開示】\n真犯人: ${trueKiller.name}（${trueKiller.role}）\n動機: ${trueKiller.motive}\n犯行方法: ${trueKiller.method}`);
    }
  }
</script>
